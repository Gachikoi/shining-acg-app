  #       with:
  #         deno-version: v2.x

  #     - name: Check formatting
  #       run: deno fmt --check scripts/

  #     - name: Lint TypeScript/JavaScript
  #       run: deno lint scripts/

  # frontend:
  #   name: Frontend (SvelteKit)
  #   runs-on: ubuntu-latest

  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@v4

  #     - name: Setup Node.js
  #       uses: actions/setup-node@v4
  #       with:
  #         node-version: "22"

  #     - name: Install dependencies
  #       working-directory: packages/web
  #       run: npm install

  #     - name: Check SvelteKit
  #       working-directory: packages/web
  #       run: npm run check

  backend-verify:
    name: Backend Verify (Go)
    needs: changes
    if: ${{ needs.changes.outputs.server == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.3"
          cache-dependency-path: packages/server/go.sum

      - name: Setup Buf CLI
        uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.50.0

      # 检查生成的 Proto 代码是否是最新的 (防止提交了 proto 但没提交 gen)
      - name: Check Protocol Buffers code generation
        working-directory: packages/server/proto
        run: |
          buf --version
          buf generate
          git status
          if git status | grep -q "gen/proto"; then
            echo "Error: Generated proto code is not up to date"
            git diff
            exit 1
          fi

      - name: Download dependencies
        working-directory: packages/server
        run: go mod download

      - name: Format check
        working-directory: packages/server
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "Go code is not formatted. Run 'gofmt -s -w .'"
            gofmt -s -l .
            exit 1
          fi

      # 尝试编译，确保没有编译错误（不生成文件，仅检查）
      - name: Compile check
        working-directory: packages/server
        run: go build -v -o /dev/null ./cmd

  # 1. CI 阶段：构建并推送镜像
  backend-build:
    name: Backend Build & Push
    needs: [changes, backend-verify]
    if: ${{ needs.changes.outputs.server == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # --- 关键步骤：转换用户名为小写 ---
      - name: Lowercase repository owner
        run: |
          echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: "${{ github.repository_owner }}"

      - name: Docker login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.OWNER_LC }}/shining-acg-server
          # 核心标签策略配置
          tags: |
            # 1. Develop 分支 -> :develop
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}

            # 2. Git Tag (v1.0.0) -> :1.0.0 和 :latest
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ./packages/server
          file: ./packages/server/Dockerfile
          # 关键点：如果是 PR，只 Build 不 Push
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------
  # 部署到开发环境 (Develop 分支)
  # ------------------------------------------------------------------
  deploy-dev:
    name: Deploy to Development Server
    runs-on: ubuntu-latest
    needs: [backend-build]
    if: |
      (github.event_name == 'push' && github.ref_name == 'develop') ||
      (github.event_name == 'workflow_dispatch')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to Development Environment
        run: |
          # 增加 -tt 参数强制伪终端，增加 -v 方便出错调试
          ssh -tt -v -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no root@${{ secrets.DEV_SERVER_IP }} << 'EOF'
            set -e
            cd /opt/shiningacg_dev

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            docker compose pull api-dev
            docker compose up -d --no-deps api-dev
            docker image prune -f

            # 注意：使用 -tt 后 sleep 可能需要确保输出缓冲区刷新
            sleep 3
            docker compose logs --tail=20 api-dev
            exit 0
          EOF

  # ------------------------------------------------------------------
  # 2. 部署到生产环境 (推送 TAG)
  # ------------------------------------------------------------------
  deploy-prod:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: [backend-build]
    # 触发条件：推送了 v* 格式的标签
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to Production Environment
        run: |
          # 关键修改：
          # -tt : 强制分配伪终端，解决 "Pseudo-terminal will not be allocated"
          # -v  : 输出调试信息，万一出错方便排查
          ssh -tt -v -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no root@${{ secrets.PROD_SERVER_IP }} << 'EOF'
            set -e # 任何命令出错立即退出

            # 1. 进入生产环境目录
            cd /opt/shiningacg_prod

            # 2. 登录 GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

            # 3. 拉取最新镜像
            # 注意：你的 docker-compose.yml 里的 image 必须是 ghcr.io/...:latest
            # 或者是 CI 构建时生成的对应 Tag (CI 步骤里 v* tag 会生成 :latest)
            docker compose pull api-prod

            # 4. 更新服务 (无感重启)
            docker compose up -d --no-deps api-prod

            # 5. 清理未使用的旧镜像
            docker image prune -f

            # 6. 健康检查
            echo "Waiting for service to start..."
            sleep 5

            # 检查容器是否在运行
            if [ $(docker compose ps -q api-prod | wc -l) -eq 0 ]; then
              echo "❌ Error: Production container is not running!"
              docker compose logs --tail=50 api-prod
              exit 1
            fi

            echo "✅ Deployment Successful!"
            docker compose logs --tail=20 api-prod

            # 显式退出，确保 SSH 会话正确关闭
            exit 0
          EOF

  android:
    name: Android (Kotlin)
    needs: changes
    if: ${{ needs.changes.outputs.android == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        working-directory: packages/android
        run: chmod +x gradlew

      - name: Build with Gradle
        working-directory: packages/android
        run: ./gradlew build

