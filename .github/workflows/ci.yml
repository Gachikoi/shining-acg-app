  backend-verify:
    name: Backend Verify (Go)
    needs: changes
    if: ${{ needs.changes.outputs.server == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.3"
          cache-dependency-path: packages/server/go.sum

      - name: Setup Buf CLI
        uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.50.0

      # 检查生成的 Proto 代码是否是最新的 (防止提交了 proto 但没提交 gen)
      - name: Check Protocol Buffers code generation
        working-directory: packages/server/proto
        run: |
          buf --version
          buf generate
          git status
          if git status | grep -q "gen/proto"; then
            echo "Error: Generated proto code is not up to date"
            git diff
            exit 1
          fi

      - name: Download dependencies
        working-directory: packages/server
        run: go mod download

      - name: Format check
        working-directory: packages/server
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "Go code is not formatted. Run 'gofmt -s -w .'"
            gofmt -s -l .
            exit 1
          fi

      # 尝试编译，确保没有编译错误（不生成文件，仅检查）
      - name: Compile check
        run: go build -v -o /dev/null ./cmd/main.go

  # 1. CI 阶段：构建并推送镜像
  backend-build:
    name: Backend Build & Push
    needs: [changes, backend-verify]
    if: ${{ needs.changes.outputs.server == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # --- 关键步骤：转换用户名为小写 ---
      - name: Lowercase repository owner
        run: |
          echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Docker login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ./packages/server
          file: ./packages/server/Dockerfile
          push: true
          # 缓存设置，加快构建速度
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 标签策略：
          # main -> latest
          # develop -> develop
          # PR -> pr-{number}
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/shining-acg-server:${{ github.ref_name == 'main' && 'latest' || github.ref_name }}
            ${{ github.event_name == 'pull_request' && format('ghcr.io/{0}/shining-acg-server:pr-{1}', github.repository_owner, github.event.number) || '' }}


  android:
    name: Android (Kotlin)
    needs: changes
    if: ${{ needs.changes.outputs.android == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        working-directory: packages/android
        run: chmod +x gradlew

      - name: Build with Gradle
        working-directory: packages/android
        run: ./gradlew build

