  # 1. CI 阶段：构建并推送镜像
  build-and-push:
    name: Backend Build and Push (Go)
    runs-on: ubuntu-latest
    needs: backend
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'pull_request' || github.ref_name == 'main' || github.ref_name == 'develop'
    strategy:
      matrix:
        # 定义当前可编译的微服务文件夹名，以后加服务直接在这加
        service: [account]
    steps:
      - uses: actions/checkout@v4

      # 只有当前服务文件夹有变动时才构建（节省资源）
      - name: Check for changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - 'packages/server/service/${{ matrix.service }}/**'
              - 'packages/server/gen/**'
              - 'packages/server/pkg/**'
              - 'packages/server/proto/**'
              - 'packages/server/go.mod'

      - name: Docker login to GHCR
        if: steps.filter.outputs.src == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push to GHCR
        if: steps.filter.outputs.src == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./packages/server
          dockerfile: ./packages/server/service/${{ matrix.service }}/Dockerfile
          push: true
          # 动态打标：main 分支对应 latest，develop 分支对应 develop，PR 对应 PR 编号
          tags: |
            ghcr.io/${{ github.repository_owner }}/shining-acg-${{ matrix.service }}:${{ github.ref_name == 'main' && 'latest' || github.ref_name }}
            ${{ github.event_name == 'pull_request' && format('ghcr.io/{0}/shining-acg-{1}:pr-{2}', github.repository_owner, matrix.service, github.event.number) || '' }}


#      - name: Test
#        working-directory: packages/server
#        run: go test -v ./...

  android:
    name: Android (Kotlin)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        working-directory: packages/android
        run: chmod +x gradlew

      - name: Build with Gradle
        working-directory: packages/android
        run: ./gradlew build

