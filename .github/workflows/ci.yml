  backend:
    name: Backend Verify Code (Go)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref_name == 'main' || github.ref_name == 'develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.3"
          cache-dependency-path: packages/server/go.sum

      - name: Setup Buf CLI
        uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.50.0

      - name: Check Protocol Buffers code generation
        working-directory: packages/server/proto
        run: |
          buf --version
          buf generate
          git status
          if git status | grep -q "gen/proto"; then
            echo "Error: Generated proto code is not up to date"
            git diff
            exit 1
          fi

      - name: Download dependencies
        working-directory: packages/server
        run: go mod download

      - name: Format check
        working-directory: packages/server
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "Go code is not formatted. Run 'gofmt -s -w .'"
            gofmt -s -l .
            exit 1
          fi

      - name: Vet
        working-directory: packages/server
        run: go vet ./...

