name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop] # 新增：合并后触发构建正式镜像
    tags: ["v*"]
  workflow_dispatch: # 允许手动触发部署

# 权限配置：需要读取代码和推送到 ghcr
permissions:
  contents: read
  packages: write
  pull-requests: read

jobs:
  # 只检测哪些模块发生了变化，后续任务根据该输出决定是否执行
  changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      android: ${{ steps.filter.outputs.android }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'packages/server/**'
            android:
              - 'packages/android/**'
            web:
              - 'packages/web/**'

  # lint-and-format:
