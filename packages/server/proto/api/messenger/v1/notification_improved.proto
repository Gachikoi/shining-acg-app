//// ==========================================
//// 使用示例说明
//// ==========================================
//
//// 场景 1：查看"谁赞了我" (CATEGORY_INTERACTION)
//// ────────────────────────────────────────────────────
//// 请求：
////   category = CATEGORY_INTERACTION
////
//// 响应示例：
////   {
////     "notification_id": "notif_123",
////     "type": "TYPE_LIKE_POST",
////     "category": "CATEGORY_INTERACTION",
////     "actors": [
////       {"user_id": "user_1", "name": "张三", "avatar": "xxx", "verified_title": "23届部长"},
////       {"user_id": "user_2", "name": "李四", "avatar": "yyy"}
////     ],
////     "actor_count": 5,  // 张三、李四等5人
////     "title": "赞了你的帖子",
////     "content": null,
////     "target": {
////       "content_id": "post_456",
////       "content_type": "CONTENT_TYPE_POST",
////       "preview_image": "https://example.com/post_cover.jpg",
////       "summary": "这是帖子的前20字摘要..."
////     },
////     "is_read": false,
////     "created_at": 1676377200
////   }
////
//// 前端渲染：
////   [张三头像] [李四头像] 等5人  赞了你的帖子  [帖子封面图]
////                                            这是帖子的前20字摘要...
//
//// 场景 2：查看"谁评论了我" (CATEGORY_COMMENT)
//// ────────────────────────────────────────────────────
//// 请求：
////   category = CATEGORY_COMMENT
////
//// 响应示例：
////   {
////     "notification_id": "notif_124",
////     "type": "TYPE_COMMENT_POST",
////     "category": "CATEGORY_COMMENT",
////     "actors": [
////       {"user_id": "user_3", "name": "王五", "avatar": "zzz"}
////     ],
////     "actor_count": 1,
////     "title": "评论了你的帖子",
////     "content": "这个真的好看！想知道在哪里拍的？", // 🎯 评论的具体内容
////     "target": {
////       "content_id": "post_789",
////       "content_type": "CONTENT_TYPE_POST",
////       "preview_image": "https://example.com/post_cover2.jpg",
////       "summary": "今天的风景真美..."
////     },
////     "is_read": false,
////     "created_at": 1676377300
////   }
////
//// 前端渲染：
////   [王五头像] 王五  评论了你的帖子  [帖子封面图]
////                   这个真的好看！想知道在哪里拍的？
//
//// 场景 3：查看"谁关注了我" (CATEGORY_FOLLOW)
//// ────────────────────────────────────────────────────
//// 请求：
////   category = CATEGORY_FOLLOW
////
//// 响应示例：
////   {
////     "notification_id": "notif_125",
////     "type": "TYPE_FOLLOW",
////     "category": "CATEGORY_FOLLOW",
////     "actors": [
////       {"user_id": "user_4", "name": "赵六", "avatar": "aaa", "verified_title": "设计部"}
////     ],
////     "actor_count": 1,
////     "title": "关注了你",
////     "content": null,
////     "target": {
////       "content_id": "user_4",
////       "content_type": "CONTENT_TYPE_USER"
////     },
////     "is_read": false,
////     "created_at": 1676377400
////   }
////
//// 前端渲染：
////   [赵六头像] 赵六  关注了你  [关注按钮]
////              设计部
//
//// 场景 4：查看"回复了我的评论" (嵌套场景)
//// ────────────────────────────────────────────────────
//// 响应示例：
////   {
////     "notification_id": "notif_126",
////     "type": "TYPE_REPLY_COMMENT",
////     "category": "CATEGORY_COMMENT",
////     "actors": [
////       {"user_id": "user_5", "name": "孙七", "avatar": "bbb"}
////     ],
////     "actor_count": 1,
////     "title": "回复了你的评论",
////     "content": "在学校操场拍的！", // 🎯 回复的内容
////     "target": {
////       "content_id": "comment_999",
////       "content_type": "CONTENT_TYPE_COMMENT",
////       "summary": "这个地方在哪里？", // 你的评论
////       "parent": { // 🎯 上下文：在哪个帖子下
////         "content_id": "post_789",
////         "content_type": "CONTENT_TYPE_POST",
////         "preview_image": "https://example.com/post_cover2.jpg",
////         "summary": "今天的风景真美..."
////       }
////     },
////     "is_read": false,
////     "created_at": 1676377500
////   }
////
//// 前端渲染：
////   [孙七头像] 孙七  回复了你的评论  [帖子封面图]
////                   在学校操场拍的！
////                   你的评论：这个地方在哪里？
