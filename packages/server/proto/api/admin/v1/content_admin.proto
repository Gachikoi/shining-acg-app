syntax = "proto3";

package api.admin.v1;

import "api/common/v1/common.proto";
import "api/community/v1/content.proto";
import "google/api/annotations.proto";

// 内容管理服务 - 负责社区内容的后台管理功能
// 包含帖子管理、分区管理、内容审核等功能
service ContentAdminService {
  // 获取帖子列表 - 分页获取所有帖子信息
  // 支持按状态、分区、作者等筛选
  rpc ListPosts(ListPostsRequest) returns (ListPostsResponse) {
    option (google.api.http) = {
      get: "/v1/admin/posts"
    };
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // 删除帖子 - 删除指定的帖子
  // 支持批量删除，删除后不可恢复
  rpc DeletePost(DeletePostRequest) returns (DeletePostResponse) {
    option (google.api.http) = {
      delete: "/v1/admin/posts/{post_id}"
    };
  }

  // 审核帖子 - 对帖子进行审核，支持通过或驳回
  // 驳回时需要填写驳回原因
  rpc ApprovePost(ApprovePostRequest) returns (ApprovePostResponse) {
    option (google.api.http) = {
      put: "/v1/admin/posts/{post_id}/approve"
      body: "*"
    };
  }

  // 分区管理 - 新增或更新分区信息
  // 支持创建新分区或修改已有分区的信息
  rpc UpsertPartition(UpsertPartitionRequest) returns (UpsertPartitionResponse) {
    option (google.api.http) = {
      put: "/v1/admin/partitions"
      body: "*"
    };
  }

  // 删除分区 - 删除指定的分区
  // 注意：删除分区前需要确保该分区下没有关联的帖子
  rpc DeletePartition(DeletePartitionRequest) returns (DeletePartitionResponse) {
    option (google.api.http) = {
      delete: "/v1/admin/partitions/{id}"
    };
  }

  // 获取分区列表 - 获取所有分区信息
  rpc ListPartitions(ListPartitionsRequest) returns (ListPartitionsResponse) {
    option (google.api.http) = {
      get: "/v1/admin/partitions"
    };
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// 获取帖子列表请求
message ListPostsRequest {
  string partition_id = 1;       // 分区ID（可选）
  string author_id = 2;          // 作者ID（可选）
  PostStatus status = 3;         // 状态筛选（可选）
  api.common.v1.Pagination pagination = 4; // 分页参数
}

// 获取帖子列表响应
message ListPostsResponse {
  repeated api.community.v1.Post posts = 1; // 帖子列表
  string next_page_token = 2;              // 下一页令牌
}

// 删除帖子请求
message DeletePostRequest {
  string post_id = 1;            // 帖子ID
}

// 删除帖子响应
message DeletePostResponse {}

// 审核状态枚举
enum PostStatus {
  POST_STATUS_DRAFT = 0;         // 草稿
  POST_STATUS_PENDING = 1;       // 待审核
  POST_STATUS_PUBLISHED = 2;     // 已发布
  POST_STATUS_REJECTED = 3;      // 已驳回
  POST_STATUS_DELETED = 4;       // 已删除
}

// 审核帖子请求
message ApprovePostRequest {
  string post_id = 1;            // 帖子ID
  bool approve = 2;              // true=通过, false=驳回
  string reject_reason = 3;      // 驳回原因（仅当 approve 为 false 时需要）
}

// 审核帖子响应
message ApprovePostResponse {
  bool succeed = 1;              // 是否成功
  string message = 2;            // 响应信息
}

// 分区信息
message Partition {
  string id = 1;                 // 分区ID
  string name = 2;               // 分区名称
  string description = 3;        // 分区描述
  string icon_url = 4;           // 分区图标
  int32 sort_order = 5;          // 排序顺序
  bool is_active = 6;            // 是否启用
  int64 created_at = 7;          // 创建时间戳
  int64 updated_at = 8;          // 更新时间戳
}

// 分区管理请求
message UpsertPartitionRequest {
  Partition partition = 1;       // 分区信息，包含ID，ID存在则更新，不存在则创建
}

// 分区管理响应
message UpsertPartitionResponse {
  string partition_id = 1;       // 分区ID
}

// 删除分区请求
message DeletePartitionRequest {
  string id = 1;                 // 分区ID
}

// 删除分区响应
message DeletePartitionResponse {}

// 获取分区列表请求
message ListPartitionsRequest {}

// 获取分区列表响应
message ListPartitionsResponse {
  repeated Partition partitions = 1; // 分区列表
}
