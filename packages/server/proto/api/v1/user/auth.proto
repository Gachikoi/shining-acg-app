syntax = "proto3";

package api.v1.user;

import "api/v1/common/common.proto";

// 认证服务
service AuthService {
  // QQ 登录/注册
  rpc Login(LoginRequest) returns (LoginResponse);

  // 退出登录
  rpc Logout(LogoutRequest) returns (LogoutResponse);

  // 刷新 Token
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
}

// 登录请求
message LoginRequest {
  string qq_access_token = 1;  // QQ 访问令牌
  string device_info = 2;     // 设备信息
}

// 登录响应
message LoginResponse {
  string session_token = 1;         // 会话令牌
  common.UserSummary me = 2;              // 用户信息
}

// 退出登录请求
message LogoutRequest {}

// 退出登录响应
message LogoutResponse {}

// 刷新 Token 请求
message RefreshTokenRequest {
  string refresh_token = 1;  // 刷新令牌
}

// 刷新 Token 响应
message RefreshTokenResponse {
  string session_token = 1;  // 新的会话令牌
}