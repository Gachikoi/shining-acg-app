syntax = "proto3";

package api.v1;

import "api/v1/common.proto";
import "api/v1/user.proto"; // 引用 UserSummary

// 消息与通知服务
service MessageService {
  // --- 私信会话 (Chat) 相关 ---

  // 获取会话列表：包含联系人简略信息、最后一条消息、未读数
  rpc ListConversations(ListConversationsRequest) returns (ListConversationsResponse);

  // 获取聊天记录：支持关键词搜索与分页
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);

  // 发送私信：支持文本、图片、视频等
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);

  // --- 通知 (Notification) 相关 ---

  // 获取通知列表：按类型筛选
  rpc ListNotifications(ListNotificationsRequest) returns (ListNotificationsResponse);

  // 批量标记已读：支持按会话或按通知分类标记
  rpc MarkRead(MarkReadRequest) returns (MarkReadResponse);
}

// --- 私信模型 ---

enum MessageType {
  MESSAGE_TYPE_UNSPECIFIED = 0;
  MESSAGE_TYPE_TEXT = 1;
  MESSAGE_TYPE_IMAGE = 2;
  MESSAGE_TYPE_VIDEO = 3;
  MESSAGE_TYPE_AUDIO = 4;
}

message Message {
  string message_id = 1;
  string sender_id = 2;
  string receiver_id = 3;
  MessageType type = 4;
  string content = 5;
  int64 sent_at = 6; // 毫秒时间戳
  bool is_read = 7;

  // 消息发送状态
  enum Status {
    SENDING = 0;
    SUCCESS = 1;
    FAILED = 2;
  }
  Status status = 8;
}

message Conversation {
  string conversation_id = 1;
  UserSummary peer = 2;         // 对方用户信息（头像、昵称、部门徽章）
  Message last_message = 3;    // 最后一条消息摘要
  int32 unread_count = 4;      // 未读数
  int64 updated_at = 5;        // 用于排序
  bool is_pinned = 6;          // 是否置顶
}

// --- 通知模型 ---

// 互动通知分类
enum NotificationAction {
  ACTION_UNSPECIFIED = 0;
  ACTION_LIKE = 1;           // 赞
  ACTION_COLLECTION = 2;     // 收藏
  ACTION_COMMENT = 3;        // 评论
  ACTION_MENTION = 4;        // @ 提到
  ACTION_FOLLOW = 5;         // 新增关注
  ACTION_SYSTEM = 6;         // 晒你通知（系统管理通知）
  ACTION_REPORT_FEEDBACK = 7; // 举报受理反馈（管理通知）
}

message Notification {
  string notification_id = 1;
  NotificationAction action = 2; // 通知具体动作
  string title = 3;              // 标题
  string content = 4;            // 预览文本（如评论的具体内容）

  // 关联对象
  string target_id = 5;          // 关联的帖子ID或评论ID
  string target_type = 6;        // 目标类型（post/comment）

  // 聚合互动者信息：支持“xx等n人赞了你”
  repeated UserSummary actors = 7;
  int32 total_actors_count = 8;   // 总参与人数

  bool is_read = 9;
  int64 created_at = 10;          // 创建时间，遵循原则A显示规则
}

// --- 请求与响应 ---
message ListConversationsRequest {
  Pagination pagination = 1;  // 游标分页
}

message ListConversationsResponse {
  repeated Conversation conversations = 1;
  string next_page_token = 2;
}

message ListMessagesRequest {
  string peer_id = 1;
  Pagination pagination = 2;
  string search_keyword = 3; // 对话内关键词搜索
}

message ListMessagesResponse {
  repeated Message messages = 1;
  string next_page_token = 2;
}

message SendMessageRequest {
  string receiver_id = 1;
  string content = 2;
  MessageType type = 3;
}

message SendMessageResponse {
  Message message = 1;
}

message ListNotificationsRequest {
  // 按互动类型过滤
  NotificationAction filter_actions = 1;
  Pagination pagination = 2;
}

message ListNotificationsResponse {
  repeated Notification notifications = 1;
  string next_page_token = 2;
  int32 total_unread_count = 3; // 方便 Tab 导航栏显示角标
}

message MarkReadRequest {
  enum Scope {
    SCOPE_ALL = 0;                  // 清除所有红点
    SCOPE_CONVERSATION = 1;         // 标记一个会话已读
    SCOPE_NOTIFICATION_TYPE = 2;    // 标记一个类型已读
  }
  Scope scope = 1;
  oneof target {                    // 会话ID 或 通知类型枚举值
    string conversation_id = 2;
    NotificationAction notification_type = 3;
  }
}

message MarkReadResponse {
  bool success = 1;
}