syntax = "proto3";

package api.account.v1;

import "api/common/v1/common.proto";
import "google/protobuf/field_mask.proto";
import "google/api/annotations.proto";

// 用户服务
service UserService {
  // --- 个人信息 ---

  // 获取当前登录用户的完整信息（包含敏感设置）
  rpc GetMe(GetMeRequest) returns (GetMeResponse) {
    option (google.api.http) = {
      get: "/v1/me"
    };
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // 获取他人公开信息 (经过隐私计算)
  rpc GetUsers(GetUsersRequest) returns (GetUsersResponse) {
    option (google.api.http) = {
      get: "/v1/users"
    };
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // 更新个人资料 (支持部分更新)
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse) {
    option (google.api.http) = {
      patch: "/v1/me/profile"
      body: "profile"
    };
  }

  // 更新设置 (合并了通用设置和隐私设置，通过 Mask 控制)
  rpc UpdateSettings(UpdateSettingsRequest) returns (UpdateSettingsResponse) {
    option (google.api.http) = {
      patch: "/v1/me/settings"
      body: "settings"
    };
  }
  
  // --- 社交关系 ---

  // 关注/取消关注
  rpc SetFollow(SetFollowRequest) returns (SetFollowResponse) {
    option (google.api.http) = {
      put: "/v1/me/following/{target_user_id}"
      body: "*"
    };
  }

  // 关系列表 (粉丝/关注/Ta 也关注了)
  rpc ListRelationships(ListRelationshipsRequest) returns (ListRelationshipsResponse) {
    option (google.api.http) = {
      get: "/v1/users/{user_id}/relationships"
    };
  }
  // --- 认证 ---

  // 申请身份认证
  rpc ApplyVerification(ApplyVerificationRequest) returns (ApplyVerificationResponse) {
    option (google.api.http) = {
      put: "/v1/me/verification"
      body: "*"
    };
  }

  // 修改所属部门
  rpc ModifyDepartments(ModifyDepartmentsRequest) returns (ModifyDepartmentsResponse) {
    option (google.api.http) = {
      put: "/v1/me/departments"
      body: "*"
    };
  }
}

// ---------------------------------------------------------
// 核心数据模型
// ---------------------------------------------------------

// 用户公开资料 (他人可见)
message UserProfile {
  // 基础信息 (ID, Name, 头像, 部门徽章, 认证头衔)
  api.common.v1.UserSummary base = 1;
  repeated api.common.v1.Link links = 2;  // 外部链接

  // 统计数据 (建议单独通过 FieldMask 控制是否返回)
  UserStats stats = 3;

  // 关系状态 (当前查看者 vs 这个用户)
  UserRelationStatus relation_status = 4;

  // 扩展字段
  api.common.v1.Role role = 5; // 用户角色
}

// 统计数据
message UserStats {
  int64 follower_count = 1;
  int64 following_count = 2;
  int64 like_count_received = 3;       // 获得的赞
  int64 collect_count_received = 4;       // 获得的收藏
  int64 view_count_received = 5;       // 获得浏览
}

// 关系状态 (计算后的结果)
message UserRelationStatus {
  bool is_following = 1;       // 我是否关注了他
  bool is_followed_by = 2;     // 他是否关注了我 (互关判断)
  // bool is_blocking = 3;        // 我是否拉黑了他
  string origin_name = 4;           // 用户原名

  // 隐私权限结果 (Critical: 不要返回 PrivacySettings，返回 Capability)
  bool can_send_message = 10;  // 是否能发私信
  // bool can_view_list = 11;     // 是否能看他的关注列表
  bool can_view_liked_posts = 11; // 是否能看他的点赞帖子
  bool can_view_collected_posts = 12; // 是否能看他的收藏帖子
}

// 用户通用设置 (仅自己可见)
message UserSettings {
  NotificationSettings notification = 1;
  PrivacySettings privacy = 2;
  AppearanceSettings appearance = 3;
}

// 隐私设置 (仅自己可见)
message PrivacySettings {
  ChatPrivacyLevel message_permission = 1;    // 谁可以私信我
  // PrivacyLevel list_visibility = 2;       // 谁可以看我的关注/粉丝列表
  BasePrivacyLevel liked_posts_visibility = 3; // 谁可以看我的点赞帖子
  BasePrivacyLevel collected_posts_visibility = 4; // 谁可以看我的收藏帖子
}

// 通知设置 (仅自己可见)
message NotificationSettings {
  bool push_enabled = 1;               // 全局推送开关
  bool push_chat = 2;                  // 私信推送
  bool push_comment_at = 3;            // 评论与 @ 推送
  bool push_like_collect = 4;          // 点赞与收藏推送
  bool push_new_follower = 5;          // 新粉丝推送
  bool push_post_update = 6;           // 关注动态推送
  bool push_system = 7;                // 系统/举报反馈推送
}

// 外观设置
message AppearanceSettings {
  Theme theme = 1;

  enum Theme {
    THEME_SYSTEM = 0;   // 跟随系统
    THEME_LIGHT = 1;  // 日间模式
    THEME_DARK = 2;   // 夜间模式
  }
}

enum BasePrivacyLevel {
  BASE_PRIVACY_LEVEL_PUBLIC = 0;
  BASE_PRIVACY_LEVEL_PRIVATE = 1;
}

enum ChatPrivacyLevel {
  CHAT_PRIVACY_LEVEL_PUBLIC = 0;
  CHAT_PRIVACY_LEVEL_FOLLOWERS = 1;
  CHAT_PRIVACY_LEVEL_MUTUAL = 2;
  CHAT_PRIVACY_LEVEL_PRIVATE = 3;
}

// ---------------------------------------------------------
// 请求与响应
// ---------------------------------------------------------

message GetMeRequest {
  // 不需要 user_id，从 Token 解析
}

message GetMeResponse {
  UserProfile profile = 1;
  UserSettings settings = 2;
}

message GetUsersRequest {
  repeated string user_ids = 1;
}

message GetUsersResponse {
  repeated UserProfile users = 1;
}

message UpdateProfileRequest {
  UserProfile profile = 1;
  google.protobuf.FieldMask update_mask = 2;
}

message UpdateProfileResponse {
}

// 统一设置更新
message UpdateSettingsRequest {
  // 可选：将 Privacy 和 UserSettings 分开传，或者合并
  UserSettings settings = 1;

  // 必须：指定更新哪些字段 (例如 paths: ["privacy_settings.message_permission"])
  google.protobuf.FieldMask update_mask = 3;
}

message UpdateSettingsResponse {
}

// 统一关注操作
message SetFollowRequest {
  string target_user_id = 1;
  bool is_active = 2; // true=关注, false=取关
}

message SetFollowResponse {
  bool is_active = 1;
  bool is_mutual = 2; // 返回是否变成了互关，前端可显示"互相关注"图标
}

// 统一关系列表
message ListRelationshipsRequest {
  string user_id = 1; // 查看谁的关系
  enum RelationType {
    RELATION_TYPE_FOLLOWING = 0; // 关注的人
    RELATION_TYPE_FOLLOWERS = 1; // 粉丝
    RELATION_TYPE_MUTUAL_FOLLOWERS = 2; // 互相关注
  }
  RelationType type = 2;
  api.common.v1.Pagination pagination = 3;
  string keyword = 4; // 可选：按昵称/备注/QQ号搜索过滤
}

message ListRelationshipsResponse {
  // 这里不直接返回 UserSummary，建议返回 UserProfile 或者包含 RelationStatus 的对象
  // 这样在列表中就能知道"我是否也关注了这个粉丝"
  repeated UserProfile users = 1;
  string next_page_token = 2;
}

message ApplyVerificationRequest {
  string verified_title = 1; // 申请的认证头衔 (如: 23届部长, 社团负责人)
}

message ApplyVerificationResponse {
}

message ModifyDepartmentsRequest {
  repeated string ids = 1; // 选择的部门 ID 列表
}

message ModifyDepartmentsResponse {
}