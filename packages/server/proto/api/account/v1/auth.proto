syntax = "proto3";

package api.account.v1;

import "api/common/v1/common.proto";
import "google/api/annotations.proto";

service AuthService {
  // 统一登录接口 (支持 QQ, 微信, 手机号等)
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/v1/auth/login"
      body: "*"
    };
  }

  // 退出登录
  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (google.api.http) = {
      delete: "/v1/auth/session"
    };
  }

  // 刷新 Token (换取新的 AccessToken)
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse) {
    option (google.api.http) = {
      post: "/v1/auth/refresh"
      body: "*"
    };
  }

  // 更新推送 Token (FCM/APNS 等)
  rpc UpdatePushToken(UpdatePushTokenRequest) returns (UpdatePushTokenResponse) {
    option (google.api.http) = {
      patch: "/v1/auth/push-token"
      body: "*"
    };
  }
}

// ---------------------------------------------------------
// 数据模型
// ---------------------------------------------------------

enum DevicePlatform {
  DEVICE_PLATFORM_UNSPECIFIED = 0;
  DEVICE_PLATFORM_IOS = 1;
  DEVICE_PLATFORM_ANDROID = 2;
  DEVICE_PLATFORM_WEB = 3;
}

message DeviceInfo {
  string device_id = 1;       // 唯一设备 ID (如 UUID 或 厂商自生成 ID)
  string device_name = 2;     // 设备名 (e.g. "iPhone 14 Pro")
  DevicePlatform platform = 3; // 平台类型
  string os_version = 4;      // 系统版本 (e.g. "iOS 16.0")
  string client_version = 5;  // App/前端版本号
  string push_token = 6;      // 推送 Token (FCM/APNS/MiPush)
}

// ---------------------------------------------------------
// 请求与响应
// ---------------------------------------------------------

message LoginRequest {
  // 凭证载荷：QQ 传 AccessToken
  string credential = 1;
  DeviceInfo device = 2;
}

message LoginResponse {
  string access_token = 1;   // 短期令牌 (如 2小时)
  string refresh_token = 2;  // 长期令牌 (如 30天)
  int64 access_expire_at = 3;  // 过期绝对时间戳
  int64 refresh_expire_at = 4; // 过期绝对时间戳

  api.common.v1.UserSummary user = 5; // 用户基本信息
}

message LogoutRequest {
  // 是否踢掉所有设备 (修改密码后通常为 true)
  // bool logout_all_devices = 1;
}

message LogoutResponse {}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2;    // 可选：实现 RefreshToken 轮转机制时，会下发新的 RT
  int64 access_expire_at = 3;
  int64 refresh_expire_at = 4; // 过期绝对时间戳
}
message UpdatePushTokenRequest {
  string push_token = 1;
  string device_id = 2; // 标识是哪个设备变更了 token
}

message UpdatePushTokenResponse {}
