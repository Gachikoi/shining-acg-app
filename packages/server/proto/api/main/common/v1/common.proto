syntax = "proto3";

package api.main.common.v1;

import "buf/validate/validate.proto";

//--------------------
// 分页模型
// 基于游标的分页模型
message CursorPagination {
  int32 need_num = 1 [(buf.validate.field).int32.gt = 0]; // 需要返回的帖子数量
  // 游标分数、时间戳或其他标识符，用于推荐、热度、时间排序的瀑布流分页加载。
  // 游标分数：用于推荐/热度算法的分页加载，表示上次返回结果中的最后一项的分数
  // 游标时间戳：用于时间排序的分页加载，表示上次返回结果中的最后一项的发布时间
  optional string cursor = 2 [(buf.validate.field).string.pattern = "\\S"]; // 为空则说明是首次请求第一页数据
}

//--------------------
// 刷新类型枚举
enum RefreshType {
  REFRESH_TYPE_UNSPECIFIED = 0;
  REFRESH_TYPE_PULL_DOWN = 1; // 下拉刷新，获取最新数据
  REFRESH_TYPE_PULL_UP = 2; // 上拉加载，获取历史数据
}

//--------------------
// 时间范围结构（毫秒级时间戳）
message TimeRange {
  int64 start_timestamp = 1; // 开始时间
  int64 end_timestamp = 2; // 结束时间
}

//--------------------
// 部门数据，用于：用户徽章渲染
message DepartmentBase {
  string id = 1; // ID
  string name = 2; // 全称 (如 "轻音部")
}

//--------------------
// 外部链接结构
message Link {
  string label = 1 [(buf.validate.field).string ={
    min_len : 1,
    max_len : 12,
    pattern : "\\S"
  }];
  string url = 2 [(buf.validate.field).string.uri_ref = true]; // 实际跳转地址
}

// 用户角色枚举
enum Role {
  ROLE_VISITOR = 0; // 游客
  ROLE_USER = 1; // 用户
  ROLE_ADMIN = 2; // 内容管理员
  ROLE_SUPER_ADMIN = 3; // 超级管理员
}

// 用户数据模型
message UserBrief {
  string user_id = 1; // 用户ID
  string name = 2; // 用户名
  optional string remark = 3; // 用户备注
  string avatar = 4; // 头像URL
  string qq_number = 5; // QQ 号
  Role role = 6; // 用户角色
}

message UserSummary {
  string user_id = 1; // 用户ID
  string name = 2; // 用户名
  optional string remark = 3; // 用户备注
  string avatar = 4; // 头像URL
  string qq_number = 5; // QQ 号
  Role role = 6; // 用户角色
  string verified_title = 7; // 认证头衔（如：23届部长）
  repeated DepartmentBase departments = 8; // 所所属部门
  UserStats stats = 9;
}

message UserProfile {
  string user_id = 1;
  string name = 2;
  optional string remark = 3; // 用户备注
  string avatar = 4;
  string qq_number = 5;
  Role role = 6; // 用户角色
  string verified_title = 7; // 认证头衔（如：23届部长）
  repeated DepartmentBase departments = 8; // 所所属部门
  UserStats stats = 9;
  repeated Link links = 10; // 外部链接
}

// 统计数据
message UserStats {
  int64 follower_count = 1; // 粉丝数
  int64 following_count = 2; // 关注数
  int64 like_count_received = 3; // 获得的赞
  int64 collect_count_received = 4; // 获得的收藏
  int64 view_count_received = 5; // 获得浏览
}

// 关系状态 (仅关注关系)
message UserRelationStatus {
  bool is_following = 1; // 当前用户是否关注了目标用户
  bool is_followed_by = 2; // 目标用户是否关注了当前用户
}

// 隐私能力 (当前用户对目标用户的操作权限)
// Critical: 不要返回 PrivacySettings，返回计算后的 Capability
message UserViewCapabilities {
  bool can_chat = 1; // 是否可以发送私信
  bool can_view_liked_posts = 2; // 是否可以查看点赞列表
  bool can_view_collected_posts = 3; // 是否可以查看收藏列表
}

