syntax = "proto3";

package api.main.post.v1;

import "buf/validate/validate.proto";
import "api/main/post/v1/post_models.proto";
import "api/media/v1/media_models.proto";
import "google/protobuf/field_mask.proto";

// ---------------------------------------------------------
// 获取帖子详情（可以据此增加帖子查看数量）
message GetPostRequest {
  string post_id = 1 [(buf.validate.field).string.pattern = "\\S"];
}

message GetPostResponse {
  Post post = 1;
}

// ---------------------------------------------------------
// 发布帖子
message CreatePostRequest {
  string batch_id = 1 [(buf.validate.field).string.pattern = "\\S"];
  optional string title = 2;
  optional string content = 3;
  string partition_id = 4 [(buf.validate.field).string.pattern = "\\S"];
  // 已完成上传与处理的媒体资产列表。
  // 后端按每个 MediaAsset.order_index 保存，不依赖数组位置。
  repeated api.media.v1.MediaAsset media_assets = 5;
}

message CreatePostResponse {}

// ---------------------------------------------------------
// 编辑帖子
message EditPostRequest {
  string post_id = 1 [(buf.validate.field).string.pattern = "\\S"];
  // 要更新的字段值
  // cover/media 的顺序均以 MediaAsset.order_index 为准。
  api.media.v1.MediaAsset cover = 2;
  repeated api.media.v1.MediaAsset media = 3;
  optional string title = 4;
  optional string content = 5;
  string partition_id = 6 [(buf.validate.field).string.pattern = "\\S"];

  // 字段掩码，用于指定本次请求需要更新哪些字段
  // 例如：paths: ["title", "content"]
  google.protobuf.FieldMask update_mask = 7;
}

message EditPostResponse {}

// ---------------------------------------------------------
// 删除帖子
message DeletePostRequest {
  string post_id = 1 [(buf.validate.field).string.pattern = "\\S"];
}

message DeletePostResponse {}

// ---------------------------------------------------------
// 点赞/取消点赞
message SetPostLikeRequest {
  string post_id = 1 [(buf.validate.field).string.pattern = "\\S"];
  bool is_liked = 2; // true=点赞, false=取消点赞
}

message SetPostLikeResponse {}

// ---------------------------------------------------------
// 收藏/取消收藏
message SetPostCollectRequest {
  string post_id = 1 [(buf.validate.field).string.pattern = "\\S"];
  bool is_collected = 2; // true=收藏, false=取消收藏
}

message SetPostCollectResponse {}
