syntax = "proto3";

package api.main.report.v1;

import "api/main/report/v1/report_req_res.proto";
import "google/api/annotations.proto";

service ReportService {
  // --- 用户举报操作 ---
  // 注意！多个用户举报同一对象时会合并为一条举报记录，并增加 report_count 字段计数

  // 举报用户
  rpc ReportUser(ReportUserRequest) returns (ReportUserResponse) {
    option (google.api.http) = {
      post: "/v1/reports/users"
      body: "*"
    };
  }

  // 举报帖子
  rpc ReportPost(ReportPostRequest) returns (ReportPostResponse) {
    option (google.api.http) = {
      post: "/v1/reports/posts"
      body: "*"
    };
  }

  // 举报评论
  rpc ReportComment(ReportCommentRequest) returns (ReportCommentResponse) {
    option (google.api.http) = {
      post: "/v1/reports/comments"
      body: "*"
    };
  }

  // --- 管理员操作 ---

  // 获取举报列表（管理员）
  rpc ListReports(ListReportsRequest) returns (ListReportsResponse) {
    option (google.api.http) = {get: "/v1/reports"};
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  //  查看证据列表（管理员），目前只有举报用户时会有证据（举报说明和图片）
  rpc ListReportEvidence(ListReportEvidenceRequest) returns (ListReportEvidenceResponse) {
    option (google.api.http) = {get: "/v1/reports/{report_id}/evidence"};
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // 驳回举报（管理员）
  rpc RejectReport(RejectReportRequest) returns (RejectReportResponse) {
    option (google.api.http) = {
      put: "/v1/reports/{report_id}/rejection"
      body: "*"
    };
    option idempotency_level = IDEMPOTENT;
  }

  // 封禁用户/删除评论/帖子（管理员）
  rpc ApprovalReport(ApprovalReportRequest) returns (ApprovalReportResponse) {
    option (google.api.http) = {
      put: "/v1/reports/{report_id}/approval"
      body: "*"
    };
    option idempotency_level = IDEMPOTENT;
  }
}
