syntax = "proto3";

package api.main.sync.v1;

// SyncDataType 定义可订阅的同步数据类型。
enum SyncDataType {
  SYNC_DATA_TYPE_UNSPECIFIED = 0;
  SYNC_DATA_TYPE_USER_SETTINGS = 1;
  SYNC_DATA_TYPE_NOTIFICATION_SETTINGS = 2;
  SYNC_DATA_TYPE_PRIVACY_SETTINGS = 3;
  SYNC_DATA_TYPE_CONTENT_CATEGORY_ORDER = 4;
}

// SyncStatus 描述当前用户的同步状态。
message SyncStatus {
  string user_id = 1;
  repeated ActiveDevice active_devices = 2;
  int64 last_sync_at = 3;
  map<string, int64> data_versions = 4;
}

message ActiveDevice {
  string device_id = 1;
  string device_name = 2;
  string platform = 3;
  int64 connected_at = 4;
  int64 last_active_at = 5;
  bool is_current = 6;
}
