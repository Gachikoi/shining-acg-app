syntax = "proto3";

package api.main.sync.v1;

import "api/main/sync/v1/sync_req_res.proto";
import "google/api/annotations.proto";

// SyncService 提供同步状态查询与设备管理 HTTP 接口。
//
// 说明：
// 1. 实时同步消息通过 /v1/realtime/ws 推送。
// 2. 本 service 负责同步状态查询、强制同步与设备断开控制面能力。
service SyncService {
  // 获取同步状态
  // 查询当前用户的同步状态，包括活跃设备、最后同步时间等
  rpc GetSyncStatus(GetSyncStatusRequest) returns (GetSyncStatusResponse) {
    option (google.api.http) = {get: "/v1/sync/status"};
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // 获取活跃设备列表
  // 查询当前通过 WebSocket 连接的所有设备
  rpc GetActiveDevices(GetActiveDevicesRequest) returns (GetActiveDevicesResponse) {
    option (google.api.http) = {get: "/v1/sync/devices"};
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // 强制同步
  // 主动触发全量同步，将当前设置推送到所有已连接设备
  rpc ForceSync(ForceSyncRequest) returns (ForceSyncResponse) {
    option (google.api.http) = {
      post: "/v1/sync/force"
      body: "*"
    };
  }

  // 断开指定设备连接
  // 强制断开指定设备的 WebSocket 连接
  rpc DisconnectDevice(DisconnectDeviceRequest) returns (DisconnectDeviceResponse) {
    option (google.api.http) = {delete: "/v1/sync/devices/{device_id}"};
  }
}
