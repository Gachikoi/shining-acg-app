syntax = "proto3";

package api.main.department.v1;

import "buf/validate/validate.proto";
import "api/main/department/v1/department_models.proto";

// ==========================================
// 批量新增部门
// ==========================================
message CreateDepartmentsRequest {
  repeated string names = 1 [(buf.validate.field).repeated = {
    min_items: 1
    items: {
      string: {
        pattern: "\\S"
        max_len: 12
      }
    }
  }]; // 部门名称列表，每个名称最多12个字符
}

message CreateDepartmentsResponse {
  repeated Department departments = 1; // 更新后的部门列表
}

// ==========================================
// 批量删除部门
// ==========================================
message DeleteDepartmentsRequest {
  repeated string department_ids = 1 [(buf.validate.field).repeated = {
    min_items: 1
    items: {
      string: {
        pattern: "\\S"
      }
    }
  }]; // 要删除的部门ID列表
}

message DeleteDepartmentsResponse {
  repeated Department departments = 1; // 更新后的部门列表
}

// ==========================================
// 重命名部门
// ==========================================
message RenameDepartmentRequest {
  string department_id = 1 [(buf.validate.field).string.pattern = "\\S"]; // 部门ID
  string new_name = 2 [(buf.validate.field).string = {
    pattern: "\\S"
    max_len: 12
  }]; // 新名称，最多12个字符
}

message RenameDepartmentResponse {
  Department department = 1; // 更新后的部门信息
}

// ==========================================
// 获取部门列表
// ==========================================
message ListDepartmentsRequest {
  // 无需分页参数，获取所有部门
}

message ListDepartmentsResponse {
  repeated Department departments = 1; // 部门列表
}
