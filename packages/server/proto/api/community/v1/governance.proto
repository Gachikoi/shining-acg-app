syntax = "proto3";

package api.community.v1;

import "api/common/v1/common.proto";

// 社区治理服务 (审核后台)
service GovernanceService {
  // 举报列表
  rpc ListReports(ListReportsRequest) returns (ListReportsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // 裁决举报 (封禁、删除、忽略)
  rpc ResolveReport(ResolveReportRequest) returns (ResolveReportResponse);

  // 获取分区管理 (原 AdminService 里的)
//  rpc ListPartitions(ListPartitionsRequest) returns (ListPartitionsResponse);
//  rpc UpsertPartition(UpsertPartitionRequest) returns (UpsertPartitionResponse);
}

// --- 模型定义 ---

enum ReportStatus {
  REPORT_STATUS_PENDING = 0;
  REPORT_STATUS_RESOLVED = 1;
  REPORT_STATUS_REJECTED = 2; // 驳回
}

enum ReportTargetType {
  REPORT_TARGET_TYPE_POST = 0;
  REPORT_TARGET_TYPE_COMMENT = 1;
  REPORT_TARGET_TYPE_USER = 2;
}

message Report {
  string id = 1;
  string reporter_id = 2;
  string target_id = 3;
  ReportTargetType type = 4;
  string reason = 5;
  ReportStatus status = 6;
  int64 created_at = 7;
}

// --- 请求响应 ---

message ListReportsRequest {
  ReportStatus status = 1;
  api.common.v1.Pagination pagination = 2;
}
message ListReportsResponse {
  repeated Report reports = 1;
  string next_page_token = 2;
}

message ResolveReportRequest {
  string report_id = 1;
  // 裁决动作
  enum Action {
    ACTION_IGNORE = 0;       // 忽略/无违规
    ACTION_DELETE_CONTENT = 1; // 删除内容
    ACTION_BAN_USER = 2;     // 封禁用户 (通常需调用 UserAdminService)
  }
  Action action = 2;
  string note = 3;           // 处理备注
}
message ResolveReportResponse {}

