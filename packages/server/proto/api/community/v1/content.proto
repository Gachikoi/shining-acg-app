syntax = "proto3";

package api.community.v1;

// 假设 api.common.v1 在这里引用，实际使用请确保路径正确
import "api/common/v1/common.proto";
import "google/api/annotations.proto";

service ContentService {
  // 发布帖子
  rpc CreatePost(CreatePostRequest) returns (CreatePostResponse) {
    option (google.api.http) = {
      post: "/v1/posts"
      body: "*"
    };
  }

  // 删除帖子
  rpc DeletePost(DeletePostRequest) returns (DeletePostResponse) {
    option (google.api.http) = {
      delete: "/v1/posts/{post_id}"
    };
  }

  // 帖子详情
  rpc GetPost(GetPostRequest) returns (GetPostResponse) {
    option (google.api.http) = {
      get: "/v1/posts/{post_id}"
    };
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // 统一帖子列表接口
  // 涵盖：首页推荐、最新、热门、关注、部门分区、个人页作品、关键词搜索、高级筛选
  rpc ListPosts(ListPostsRequest) returns (ListPostsResponse) {
    option (google.api.http) = {
      get: "/v1/posts"
    };
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// ---------------------------------------------------------
// 核心数据结构
// ---------------------------------------------------------

message Post {
  string post_id = 1;
  api.common.v1.UserSummary author = 2;
  string title = 3;
  string content = 4;        // 详情页返回全文
  repeated api.common.v1.Media media = 5; // 后面需更改media结构

  // 交互数据
  int32 like_count = 8;
  int32 comment_count = 9;
  int32 collect_count = 10;
  int32 view_count = 11;

  // 当前用户状态
  bool is_liked = 12;
  bool is_collected = 13;
  bool is_following_author = 16; // 新增：是否已关注作者
  bool is_followed_by_author = 18; // 新增：作者是否已关注当前用户

  // 时间与状态
  int64 publish_time = 14;
  int64 edit_time = 15;
  PostStatus status = 17;    // 新增：帖子状态
}

// 帖子预览（卡片视图数据）
message PostPreview {
  // 基础信息
  string post_id = 1;
  string title = 2;

  // 摘要：后端截取内容的前N个字符（如前60字），去除Markdown/HTML格式，用于纯文本展示
  string summary = 3;

  // 封面：专门用于列表展示的媒体对象。
  // 后端逻辑：如果有图，取第一张的缩略图地址；如果是视频，取视频封面。
  api.common.v1.Media cover = 4; // TODO后续需要改变Media数据结构

  // 作者信息 (包含头像 avatar, 用户名 name, id 等)
  api.common.v1.UserSummary author = 5;

  // 核心统计数据
  int32 like_count = 6;
  int32 view_count = 7;     // 列表页通常也显示浏览量
  int32 comment_count = 8;  // 显眼的评论数能引导点击

  // 状态标记 (前端用于渲染 UI 状态)
  bool is_liked = 9;        // 当前用户是否点赞
  bool is_only_video = 10;      // UI上是否显示一个“播放”的小图标

  // 辅助信息
  int64 publish_time = 11;  // 发布时间戳，前端显示 "3小时前"
}

enum PostStatus {
  POST_STATUS_UNSPECIFIED = 0;
  POST_STATUS_PUBLISHED = 1; // 已发布
  POST_STATUS_AUDITING = 2;  // 审核中
  POST_STATUS_DELETED = 3;   // 已删除
}

// ---------------------------------------------------------
// 统一筛选请求设计 (The Unified Request)
// ---------------------------------------------------------
enum RefreshType {
  REFRESH_TYPE_UNSPECIFIED = 0;
  REFRESH_TYPE_PULL_DOWN = 1; // 下拉刷新，获取最新数据
  REFRESH_TYPE_PULL_UP = 2;   // 上拉加载，获取历史数据
}

enum TAG_TYPE {
  TAG_TYPE_UNSPECIFIED = 0;
  TAG_TYPE_SORT_METHOD = 1; // 包含该标签。对应的 value 有："latest"（最新）、"hot"（热门）、“recommended"（推荐）
}

message TAG{
  repeated string values = 1;
  TAG_TYPE type = 2;
}

message TimeRange {
  int64 start_timestamp = 1; // 开始时间
  int64 end_timestamp = 2;   // 结束时间
}

// 具体的筛选器
message PostFilter {
  // 关键词搜索
  string keyword = 1;
  // 时间范围筛选
  TimeRange time_range = 3;
}

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_RECOMMENDED = 1; // 推荐排序
  ORDER_TYPE_LATEST = 2; // 最新排序
  ORDER_TYPE_HOT = 3; // 热门排序
}

message ListPostsRequest {
  string scene = 1; // 帖子瀑布流类别："all"：全部, "following": 关注，“user”：用户，“self_post”：自己发布的帖子，“self_like”：自己点赞的帖子，“self_collect”：自己收藏的帖子，剩下的根据“编辑分区”中的分区id来区分。
  RefreshType refresh_type=2; // 刷新类型：下拉刷新（返回最新数据）/上拉加载更多（返回历史数据）
  PostFilter filter=4; // 过滤标签：用于高级筛选功能，支持多选
  int32 need_num=5; // 需要返回的帖子数量
  OrderType order_type=6; // 排序类型："score"（分数排序）、"timestamp"（时间戳排序）
  oneof cursor{
    string cursor_score=7; // 游标分数：用于推荐/热度算法的分页加载，表示上次返回结果中的最后一项的分数，order_type=ORDER_TYPE_RECOMMENDED 或 order_type=ORDER_TYPE_HOT
    string cursor_timestamp=8; // 游标时间戳：用于时间排序的分页加载，表示上次返回结果中的最后一项的发布时间，order_type=ORDER_TYPE_LATEST
  }
}

message ListPostsResponse {
  repeated PostPreview posts = 1;
  oneof cursor{
    string cursor_score=6; // 游标分数：用于推荐/热度算法的分页加载，表示上次返回结果中的最后一项的分数
    string cursor_timestamp=7; // 游标时间戳：用于时间排序的分页加载，表示上次返回结果中的最后一项的发布时间
  }
}

// ---------------------------------------------------------
// 其他基础请求
// ---------------------------------------------------------

message CreatePostRequest {
  string title = 1;
  string content = 2;
  repeated api.common.v1.Media media = 3;
  int32 partition_id = 4;
  // 可以增加 tags 等
}

message CreatePostResponse {
  Post post = 1;
}

message DeletePostRequest {
  string post_id = 1;
}

message DeletePostResponse {}

message GetPostRequest {
  string post_id = 1;
}

message GetPostResponse {
  Post post = 1;
}