syntax = "proto3";

package api.common.v1;

// 分页请求
message Pagination {
  int32 page_size = 1;    // 每页数量
  string page_token = 2;  // 游标（用于无限滚动，最后一条数据的id）
  int32 page = 3;         // 页码（用于传统分页，页面偏移量）
}

// 部门基础元数据 (Lightweight)
// 用于：用户徽章渲染、帖子分区标签、侧边栏导航
// 前端应该在 App 启动时拉取一次“全量 DepartmentBase 列表”并缓存
message DepartmentBase {
  string id = 1;      // ID
  string name = 2;        // 全称 (如 "轻音部")
}

// 用户角色枚举
enum Role {
  ROLE_VISITOR = 0;     // 游客
  ROLE_USER = 1;        // 用户
  ROLE_ADMIN = 2;       // 内容管理员
  ROLE_SUPER_ADMIN = 3; // 超级管理员
}

// 多媒体资源
message Media {
  string type = 1;        // "image" | "video"
  string url = 2;         // 资源地址
  string thumbnail = 3;   // 缩略图（视频用）
  int32 width = 4;        // 宽
  int32 height = 5;       // 高
}

// 外部链接结构
message Link {
  string label = 1; // 链接显示文字
  string url = 2;   // 实际跳转地址
}

// 基础信息摘要（用于瀑布流、列表页）
message UserSummary {
  string user_id = 1;
  string nickname = 2; // 昵称，若有备注优先显示备注
  string avatar = 3;
  repeated api.common.v1.DepartmentBase departments = 4; // 所有所属部门徽章
  bool is_verified = 5;              // 身份认证状态
  string verified_title = 6;         // 认证头衔（如：23届部长）
}