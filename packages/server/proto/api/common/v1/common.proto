syntax = "proto3";

package api.common.v1;

// 分页请求
message Pagination {
  string page_token = 1;  // 游标（用于无限滚动，最后一条数据的id）
  int32 need_num=2;
  
}

// 部门基础元数据 (Lightweight)
// 用于：用户徽章渲染、帖子分区标签、侧边栏导航
// 前端应该在 App 启动时拉取一次“全量 DepartmentBase 列表”并缓存
message DepartmentBase {
  string id = 1;      // ID
  string name = 2;        // 全称 (如 "轻音部")
}

// 用户角色枚举
enum Role {
  ROLE_VISITOR = 0;     // 游客
  ROLE_USER = 1;        // 用户
  ROLE_ADMIN = 2;       // 内容管理员
  ROLE_SUPER_ADMIN = 3; // 超级管理员
}

// 媒体资源
message Media {
  string id = 1;               // 雪花 ID
  MediaType type = 2;         // 使用枚举代替字符串

  // 核心存储标识
  string bucket = 3;          // 存储桶：shining-vod
  string object_key = 4;      // 对象路径：videos/2024/01/v001.m3u8

  // 元数据 (用 sub-message 保持整洁)
  MediaMeta meta = 5;

  // 状态与权限
  int32 status = 6;           // 0:处理中, 1:就绪, 2:违规屏蔽
}

enum MediaType {
  MEDIA_TYPE_UNSPECIFIED = 0;
  MEDIA_TYPE_IMAGE = 1;
  MEDIA_TYPE_VIDEO = 2;
}

message MediaMeta {
  int32 width = 1;
  int32 height = 2;
  int32 duration = 3;         // 视频时长（秒）
  int64 size = 4;             // 文件大小（字节）
  string mime_type = 5;       // video/mp4, image/webp
}

// 外部链接结构
message Link {
  string label = 1; // 链接显示文字
  string url = 2;   // 实际跳转地址
}

// 基础信息摘要（用于瀑布流、列表页）
message UserSummary {
  string user_id = 1;
  string nickname = 2; // 昵称，若有备注优先显示备注
  string avatar = 3;
  repeated api.common.v1.DepartmentBase departments = 4; // 所有所属部门徽章
  bool is_verified = 5;              // 身份认证状态
  string verified_title = 6;         // 认证头衔（如：23届部长）
}