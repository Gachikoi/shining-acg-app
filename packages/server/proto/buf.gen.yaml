version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: app.shiningacg.club/gen/proto
  disable:
    - module: buf.build/googleapis/googleapis
    - module: buf.build/bufbuild/protovalidate
inputs:
  - directory: .
plugins:
  - remote: buf.build/protocolbuffers/go:v1.31.0 # pb
    out: ../gen/proto
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go:v1.11.0 # go后端
    out: ../gen/proto
    opt: paths=source_relative
  - remote: buf.build/grpc-ecosystem/openapiv2:v2.27.7 # swagger文档
    out: ../../web
    opt:
      - allow_merge=true
      - merge_file_name=swagger
      - json_names_for_fields=true
      - allow_delete_body=true
      # proto3 非 optional 字段自动加入 required 数组（PR #5278，合并于 2025-03-08）
      # proto3 中用 optional 关键字明确声明的字段会被正确排除
      - use_proto3_field_semantics=true
