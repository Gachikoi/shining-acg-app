version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: shining-acg-postgres
    environment:
      POSTGRES_DB: shining_acg
      POSTGRES_USER: shining
      POSTGRES_PASSWORD: shining123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./build/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shining -d shining_acg"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: shining-acg-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Shining ACG 单体服务
  shining-acg-service:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: shining-acg-service
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=shining
      - DB_PASSWORD=shining123
      - DB_NAME=shining_acg
      - REDIS_ADDR=redis:6379
      - PORT=8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: shining-acg-network
