name: shining-acg-dev

services:
  api-dev:
    build: .
    container_name: api-dev
    restart: unless-stopped

    # 环境变量：建议使用 .env 文件管理敏感信息
    # 这里列出的是连接 postgres-dev 所需的关键变量
    environment:
      - HTTP_PORT=8000

      # 数据库连接：host 直接写 postgres-dev 服务名
      - DB_HOST=postgres-dev
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-password}
      - DB_NAME=${POSTGRES_DB:-shining_db}

      # 新增 MinIO 连接配置
      - OSS_ENDPOINT=minio-dev:9000
      - OSS_ACCESS_KEY=${MINIO_ROOT_USER:-shining}
      - OSS_SECRET_KEY=${MINIO_ROOT_PASSWORD:-shiningoss}
      - OSS_BUCKET=shining-bucket

    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "50m"   # 单个文件超过 50MB 就切分
        max-file: "3"     # 最多保留 3 个历史文件（共 150MB）

    # 网络配置：同时加入网关网络和内部网络
    networks:
      - dev_internal     # 用于连接数据库
    ports:
      - "8000:8000"
    volumes:
      - ./config.yaml:/app/config.yaml
    depends_on:
      postgres-dev:
        condition: service_healthy
      minio-dev:
        condition: service_healthy

  # MinIO 对象存储服务
  minio-dev:
    image: minio/minio:RELEASE.2025-03-12T18-04-18Z
    container_name: minio-dev
    restart: unless-stopped
    command: server /data --address ":9000" --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-shining}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-shiningoss}
      # 优化：设置浏览器访问的域名（如果有的话）
      MINIO_BROWSER_REDIRECT_URL: "http://localhost:9001"

    volumes:
      # 建议使用命名卷，或者确保 ./data/minio_data 目录存在且有写入权限
      - minio_data_dev:/data

    networks:
      - dev_internal     # 允许 api-dev 访问

    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web 控制台

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-dev:
    image: postgres:17-alpine
    container_name: postgres-dev
    restart: always

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-shining_db}

    # 数据持久化卷
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data

    # 网络：只加入内部网络，不暴露给网关
    networks:
      - dev_internal

    # 端口：开发环境映射出来方便用 Navicat/DataGrip 连接
    ports:
      - "5433:5432" # 映射到宿主机 5433，避免和本地 postgres 冲突

    # 健康检查：这是 depends_on 生效的关键
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-shining_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 1. Loki: 日志存储
  loki-dev:
    image: grafana/loki:3.0.0
    container_name: loki-dev
    user: root
    ports:
      - "3100:3100"
    volumes:
      # 映射配置文件
      - ./loki-config.yaml:/etc/loki/local-config.yaml
      # 关键：持久化日志数据
      - loki_data_dev:/tmp/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - dev_internal

  # 2. Promtail: 采集 Docker 原始日志并发送给 Loki
  promtail-dev:
    image: grafana/promtail:3.0.0
    container_name: promtail-dev
    volumes:
      # 必须映射宿主机的 Docker 日志目录（只读）
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # 映射 Promtail 的配置文件
      - ./promtail-config.yaml:/etc/promtail/config.yaml
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yaml
    networks:
      - dev_internal
    depends_on:
      - loki-dev

  # 3. Grafana: 界面展示
  grafana-dev:
    image: grafana/grafana:latest
    container_name: grafana-dev
    ports:
      - "3000:3000"
    volumes:
      - grafana_data_dev:/var/lib/grafana # 持久化配置、插件和仪表盘
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - dev_internal
    depends_on:
      - loki-dev

# --------------------------------------------------------------------------------
# 网络定义
# --------------------------------------------------------------------------------
networks:
  # 开发环境内部网络 (自动创建)
  dev_internal:
    driver: bridge
    name: dev_internal

# --------------------------------------------------------------------------------
# 卷定义
# --------------------------------------------------------------------------------
volumes:
  postgres_data_dev:
    name: postgres_data_dev
  minio_data_dev:
    name: minio_data_dev
  loki_data_dev: # 新增 Loki 的持久化卷
    name: loki_data_dev
  grafana_data_dev: # 新增 Loki 的持久化卷
    name: grafana_data_dev