server:
  http_listen_port: 9080
  grpc_listen_port: 0

clients:
  - url: http://loki-dev:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker_logs
    docker_sd_configs:
      - host: unix:///var/run/docker.sock # 必须确保 Promtail 能访问 docker socket
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
