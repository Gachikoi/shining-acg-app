# 服务器配置
server:
  port: 8000

# 数据库配置（与 docker-compose 保持一致）
db:
  host: localhost
  port: 5433
  user: postgres
  password: password
  name: shining_db

# OSS 对象存储配置（与 docker-compose 保持一致）
oss:
  endpoint: localhost:9000
  base_host: test.api.shiningacg.club:61080
  access_key: shining
  secret_key: shiningoss
  bucket: shining-bucket
  use_ssl: false

# Snowflake 雪花算法配置
snowflake:
  node_id: 1

ffmpeg:
  max_workers: 4
  queue_size: 100

# 媒体处理配置
media:
  image:
    avatar:
      max_width: 256
      max_height: 256
    post:
      max_width: 1080
      max_height: 0
    comment:
      max_width: 800
      max_height: 0
    cover:
      max_width: 1080
      max_height: 0
      crop_width: 600
      crop_height: 800

  video:
    hls:
      enabled: true